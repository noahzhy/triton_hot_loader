apiVersion: v1
kind: Namespace
metadata:
  name: triton-job-test
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: job-test-quota
  namespace: triton-job-test
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "5"
    persistentvolumeclaims: "2"
    requests.storage: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: job-test-defaults
  namespace: triton-job-test
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 128Mi
